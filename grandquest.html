<style>
  :root{
    --bg:#f4faf7;
    --panel:#ffffff;
    --border:#dcece3;
    --text:#212a25;
    --sub:#748a7e;
    --accent:#00985b;
    --accent-dark:#231916;
    --accent-light:#e2f7ef;
    --danger:#d64545;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand img{
    height:34px;
    width:auto;
    display:block;
  }
  .brand-divider{
    width:1px;
    height:28px;
    background:var(--border);
  }
  header h1{
    font-size:18px;
    margin:0;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--accent-dark);
  }
  header .sub{
    font-size:12px;
    color:var(--sub);
    margin-top:2px;
  }
  .header-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-size:13px;
    font-weight:600;
    transition:opacity .15s;
  }
  button:hover{opacity:.85;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:#eef1f6;color:var(--text);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:transparent;color:var(--sub);padding:6px 10px;}

  main{padding:20px 24px 60px;max-width:1400px;margin:0 auto;}

  .summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:8px;
    margin-bottom:20px;
  }
  .summary-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:10px 12px;
    text-align:center;
  }
  .summary-card .num{font-size:20px;font-weight:700;}
  .summary-card .label{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .period-row{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin-bottom:10px;font-size:13px;color:var(--sub);
  }
  .period-row .period-label{font-weight:600;color:var(--text);}
  .period-row input[type=month]{
    padding:7px 10px;border:1px solid var(--border);border-radius:8px;
    font-size:13px;font-family:inherit;background:#fff;color:var(--text);
  }

  .hero-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:8px;
    margin-bottom:12px;
  }
  .hero-card{
    background:linear-gradient(135deg,#00985b,#1de9b6);
    border-radius:var(--radius);
    padding:16px 18px;
    color:#fff;
    box-shadow:0 4px 14px rgba(0,152,91,.2);
  }
  .hero-card.alt{
    background:linear-gradient(135deg,#231916,#4a3a32);
    box-shadow:0 4px 14px rgba(35,25,22,.18);
  }
  .hero-card .num{font-size:26px;font-weight:800;letter-spacing:.3px;}
  .hero-card .label{font-size:12px;opacity:.9;margin-top:4px;}

  .monthly-block{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:20px;
  }
  .monthly-block h3{
    font-size:13px;margin:0 0 10px;color:var(--sub);font-weight:700;
  }
  .monthly-tags{
    display:flex;flex-wrap:wrap;gap:8px;
  }
  .month-tag{
    display:flex;flex-direction:column;
    border:1px solid var(--border);
    background:#fafbfd;
    border-radius:8px;
    padding:7px 12px;
    cursor:pointer;
    min-width:110px;
    transition:border-color .15s,background .15s;
  }
  .month-tag:hover{border-color:var(--accent);}
  .month-tag.active{
    border-color:var(--accent);
    background:var(--accent-light);
  }
  .month-tag .m-label{font-size:11px;color:var(--sub);font-weight:600;}
  .month-tag .m-amount{font-size:14px;font-weight:700;margin-top:2px;}
  .month-tag .m-count{font-size:10px;color:var(--sub);margin-top:1px;}
  .monthly-empty{font-size:12px;color:var(--sub);}

  .toolbar{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:16px;
  }
  .toolbar input[type=text], .toolbar select{
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    background:#fff;
    color:var(--text);
  }
  .toolbar .grow{flex:1;min-width:160px;}
  .toolbar .spacer{flex:1;}

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--border);
    font-size:13px;
  }
  thead th{
    background:#fafbfd;
    text-align:left;
    padding:10px 12px;
    font-size:12px;
    color:var(--sub);
    border-bottom:1px solid var(--border);
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
  }
  thead th:hover{color:var(--text);}
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#f9fafc;}

  .tag{
    display:inline-block;
    padding:3px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    color:#fff;
    white-space:nowrap;
  }
  .status-badge{
    display:inline-block;
    padding:3px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
  }
  a.url-link{color:var(--accent);text-decoration:none;font-size:12px;}
  a.url-link:hover{text-decoration:underline;}

  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    background:transparent;
    border:1px solid var(--border);
    padding:4px 8px;
    font-size:12px;
    border-radius:6px;
    color:var(--sub);
  }
  .icon-btn:hover{background:#f1f3f7;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--sub);
    font-size:13px;
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,24,33,.45);
    display:none;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .overlay.active{display:flex;}
  .modal{
    background:#fff;border-radius:14px;
    width:100%;max-width:520px;
    max-height:90vh;overflow-y:auto;
    padding:24px;
  }
  .modal h2{margin:0 0 18px;font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600;
  }
  .field input[type=text], .field input[type=date], .field input[type=url], .field select{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;
  }
  .field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;
    resize:vertical;min-height:64px;
  }
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{
    display:flex;justify-content:flex-end;gap:8px;margin-top:20px;
  }

  /* Assignee manager */
  .assignee-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .assignee-row{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  }
  .assignee-row input[type=text]{
    flex:1;border:none;font-size:13px;padding:4px;font-family:inherit;
  }
  .assignee-row input[type=text]:focus{outline:1px solid var(--accent);border-radius:4px;}
  .color-swatch{
    width:24px;height:24px;border-radius:50%;border:1px solid var(--border);cursor:pointer;flex-shrink:0;
  }
  .add-assignee-row{
    display:flex;gap:8px;align-items:center;
  }
  .add-assignee-row input[type=text]{
    flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;
  }

  footer{
    text-align:center;color:var(--sub);font-size:11px;padding:20px;
  }

  /* Lock screen */
  .lock-overlay{
    position:fixed;inset:0;z-index:100;
    background:linear-gradient(150deg,#231916,#3a2c25);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .lock-overlay.hidden{display:none;}
  .lock-card{
    background:#fff;border-radius:16px;
    width:100%;max-width:360px;
    padding:32px 28px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .lock-card img{height:36px;margin-bottom:18px;}
  .lock-card h2{font-size:15px;margin:0 0 20px;color:var(--text);font-weight:700;}
  .lock-card input[type=password]{
    width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
    font-size:18px;text-align:center;letter-spacing:.3em;font-family:inherit;
    box-sizing:border-box;
  }
  .lock-card input[type=password]:focus{outline:none;border-color:var(--accent);}
  .lock-card button{
    width:100%;margin-top:14px;padding:11px;background:var(--accent);color:#fff;font-size:14px;
  }
  .lock-error{
    color:var(--danger);font-size:12px;margin-top:10px;min-height:16px;
  }
  .btn-lock{background:transparent;border:1px solid var(--border);color:var(--sub);padding:9px 14px;}

  .memo-cell{
    max-width:160px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:var(--sub);
    font-size:12px;
  }
  .page-nav{
    background:transparent;
    border:1px solid var(--border);
    color:var(--accent-dark);
    padding:9px 14px;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
  }
  .page-nav:hover{background:#f1f3f7;opacity:1;}
</style>
</head>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <img id="lockLogo" alt="RIGEL">
    <h2>パスワードを入力してください</h2>
    <form id="lockForm">
      <input type="password" id="lockInput" inputmode="numeric" autocomplete="off" placeholder="••••" autofocus>
      <button type="submit" class="btn-primary">ログイン</button>
      <div class="lock-error" id="lockError"></div>
    </form>
  </div>
</div>

<main>
  <div class="period-row">
    <span class="period-label">集計期間</span>
    <input type="month" id="rangeFrom">
    <span>〜</span>
    <input type="month" id="rangeTo">
    <button class="btn-ghost" id="btnClearRange">全期間に戻す</button>
  </div>

  <div class="hero-row" id="heroRow"></div>

  <div class="summary" id="summary"></div>

  <div class="monthly-block">
    <h3>月別サマリー（見込み金額合計・⑤〜⑦）</h3>
    <div class="monthly-tags" id="monthlyTags"></div>
  </div>

  <div class="monthly-block">
    <h3>月別サマリー（成約金額合計・⑧成約／⑨運用開始）</h3>
    <div class="monthly-tags" id="monthlyWonTags"></div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchBox" class="grow" placeholder="会社名・役職・業種で検索">
    <select id="filterAssignee"><option value="">担当者：すべて</option></select>
    <select id="filterStatus"><option value="">ステータス：すべて</option></select>
    <select id="filterPref"><option value="">都道府県：すべて</option></select>
    <div class="spacer"></div>
    <button class="btn-ghost" id="btnClearFilters">条件クリア</button>
  </div>

  <table>
    <thead>
      <tr>
        <th data-sort="date">日付</th>
        <th data-sort="company">会社名</th>
        <th data-sort="amount">金額</th>
        <th data-sort="position">役職</th>
        <th data-sort="prefecture">都道府県</th>
        <th data-sort="industry">業種</th>
        <th data-sort="status">ステータス</th>
        <th data-sort="assignee">担当者</th>
        <th>URL</th>
        <th>メモ</th>
        <th style="width:90px;">操作</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none;">まだ案件がありません。「＋ 新規登録」から追加してください。</div>

<!-- Lead Modal -->
<div class="overlay" id="leadOverlay">
  <div class="modal">
    <h2 id="leadModalTitle">新規登録</h2>
    <form id="leadForm">
      <input type="hidden" id="leadId">
      <div class="field-row">
        <div class="field">
          <label>日付</label>
          <input type="date" id="f_date" required>
        </div>
        <div class="field">
          <label>担当者</label>
          <select id="f_assignee"></select>
        </div>
      </div>
      <div class="field">
        <label>会社名</label>
        <input type="text" id="f_company" placeholder="株式会社〇〇" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>金額（見込み） 円</label>
          <input type="number" id="f_amount" min="0" step="1000" placeholder="例：1000000">
        </div>
        <div class="field">
          <label>役職</label>
          <input type="text" id="f_position" placeholder="代表取締役 など">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>都道府県</label>
          <select id="f_prefecture"></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>業種</label>
          <input type="text" id="f_industry" list="industryList" placeholder="IT・製造業 など">
          <datalist id="industryList"></datalist>
        </div>
        <div class="field">
          <label>ステータス</label>
          <select id="f_status"></select>
        </div>
      </div>
      <div class="field">
        <label>URL</label>
        <input type="url" id="f_url" placeholder="https://example.com">
      </div>
      <div class="field">
        <label>メモ</label>
        <textarea id="f_memo" placeholder="商談の内容、次回アクションなど自由に記入"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="btnCancelLead">キャンセル</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- Assignee Modal -->
<div class="overlay" id="assigneeOverlay">
  <div class="modal">
    <h2>担当者タグ管理</h2>
    <div class="assignee-list" id="assigneeList"></div>
    <div class="add-assignee-row">
      <input type="color" id="newAssigneeColor" value="#00985b" style="width:40px;height:36px;padding:2px;border:1px solid var(--border);border-radius:8px;">
      <input type="text" id="newAssigneeName" placeholder="新しい担当者名を入力">
      <button class="btn-primary" id="btnAddAssignee">追加</button>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="btnCloseAssignees">閉じる</button>
    </div>
  </div>
</div>

    {code:'07', label:'⑦最終調整', color:'#0f766e', bg:'#e2f5f3'},
    {code:'08', label:'⑧成約', color:'#15803d', bg:'#e5f6ea'},
    {code:'09', label:'⑨運用開始', color:'#065f46', bg:'#dcf5ec'},
    {code:'10', label:'⑩失注', color:'#dc2626', bg:'#fde8e8'},
  ];

  const PREFECTURES = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];

  const INDUSTRIES = ['IT・通信','製造業','小売・流通','飲食','建設・不動産','医療・福祉','金融・保険','教育','士業・コンサル','広告・マーケティング','人材','その他'];

  const DEFAULT_COLORS = ['#00985b','#2e7d6b','#3e5c76','#c9a227','#8e5572','#4c6444','#b5482a','#5b7c99'];

  const WON_STATUSES = ['08','09']; // ⑧成約・⑨運用開始 を「成約」として集計
  function isWon(l){ return WON_STATUSES.includes(l.status); }
  const PIPELINE_STATUSES = ['04','05','06','07']; // ④初回商談〜⑦最終調整 を「見込み」として集計
  function isPipeline(l){ return PIPELINE_STATUSES.includes(l.status); }

  let rangeFrom = '';
  let rangeTo = '';
  function inRange(l){
    const ym = (l.date||'').slice(0,7);
    if(rangeFrom && ym < rangeFrom) return false;
    if(rangeTo && ym > rangeTo) return false;
    return true;
  }

  // ---------- Firestore（全員共有データ） ----------
  let leads = [];
  let assignees = [];
  const leadsCol = db.collection('gq_leads');
  const assigneesCol = db.collection('gq_assignees');

  function handleFirestoreError(err){
    console.error(err);
    alert('データの保存・取得に失敗しました。firebaseConfig の設定が正しいかご確認ください。\n' + err.message);
  }

  function statusInfo(code){ return STATUSES.find(s=>s.code===code) || STATUSES[0]; }
  function assigneeInfo(id){ return assignees.find(a=>a.id===id); }
  function formatYen(n){ n = Number(n)||0; return '¥' + n.toLocaleString('ja-JP'); }
  function monthLabel(ym){
    const [y,m] = ym.split('-');
    return `${y}年${Number(m)}月`;
  }

  // ---------- populate static selects ----------
  function fillPrefectureSelect(sel, includeAll){
    sel.innerHTML = '';
    if(includeAll){
      const o = document.createElement('option'); o.value=''; o.textContent='都道府県：すべて'; sel.appendChild(o);
    }
    PREFECTURES.forEach(p=>{
      const o = document.createElement('option'); o.value=p; o.textContent=p; sel.appendChild(o);
    });
  }
  function fillStatusSelect(sel, includeAll){
    sel.innerHTML = '';
    if(includeAll){
      const o = document.createElement('option'); o.value=''; o.textContent='ステータス：すべて'; sel.appendChild(o);
    }
    STATUSES.forEach(s=>{
      const o = document.createElement('option'); o.value=s.code; o.textContent=s.label; sel.appendChild(o);
    });
  }
  function fillAssigneeSelect(sel, includeAll){
    const current = sel.value;
    sel.innerHTML = '';
    if(includeAll){
      const o = document.createElement('option'); o.value=''; o.textContent='担当者：すべて'; sel.appendChild(o);
    } else {
      const o = document.createElement('option'); o.value=''; o.textContent='未設定'; sel.appendChild(o);
    }
    assignees.forEach(a=>{
      const o = document.createElement('option'); o.value=a.id; o.textContent=a.name; sel.appendChild(o);
    });
    if([...sel.options].some(o=>o.value===current)) sel.value = current;
  }
  function fillIndustryList(){
    const dl = document.getElementById('industryList');
    dl.innerHTML = '';
    INDUSTRIES.forEach(i=>{
      const o = document.createElement('option'); o.value=i; dl.appendChild(o);
    });
  }

  const filterAssignee = document.getElementById('filterAssignee');
  const filterStatus = document.getElementById('filterStatus');
  const filterPref = document.getElementById('filterPref');
  const searchBox = document.getElementById('searchBox');

  fillPrefectureSelect(filterPref, true);
  fillStatusSelect(filterStatus, true);
  fillIndustryList();

  const rangeFromInput = document.getElementById('rangeFrom');
  const rangeToInput = document.getElementById('rangeTo');
  rangeFromInput.addEventListener('change', ()=>{ rangeFrom = rangeFromInput.value; renderHero(); });
  rangeToInput.addEventListener('change', ()=>{ rangeTo = rangeToInput.value; renderHero(); });
  document.getElementById('btnClearRange').addEventListener('click', ()=>{
    rangeFrom = ''; rangeTo = '';
    rangeFromInput.value = ''; rangeToInput.value = '';
    renderHero();
  });

  // ---------- summary ----------
  function renderSummary(){
    const el = document.getElementById('summary');
    el.innerHTML = '';
    STATUSES.forEach(s=>{
      const count = leads.filter(l=>l.status===s.code).length;
      const card = document.createElement('div');
      card.className = 'summary-card';
      card.innerHTML = `<div class="num" style="color:${s.color}">${count}</div><div class="label">${s.label}</div>`;
      el.appendChild(card);
    });
  }

  function renderHero(){
    const el = document.getElementById('heroRow');
    const pipelineLeads = leads.filter(l=> isPipeline(l) && inRange(l));
    const totalPipeline = pipelineLeads.reduce((sum,l)=> sum + (Number(l.amount)||0), 0);
    const wonLeads = leads.filter(l=> isWon(l) && inRange(l));
    const totalWon = wonLeads.reduce((sum,l)=> sum + (Number(l.amount)||0), 0);
    const periodLabel = (rangeFrom || rangeTo)
      ? `${rangeFrom ? monthLabel(rangeFrom) : '指定なし'}〜${rangeTo ? monthLabel(rangeTo) : '指定なし'}`
      : '全期間';
    el.innerHTML = `
      <div class="hero-card">
        <div class="num">${formatYen(totalPipeline)}</div>
        <div class="label">見込み金額合計 ④〜⑦（${periodLabel}）</div>
      </div>
      <div class="hero-card alt">
        <div class="num">${formatYen(totalWon)}</div>
        <div class="label">成約金額合計 ⑧⑨（${periodLabel}）</div>
      </div>
      <div class="hero-card">
        <div class="num">${pipelineLeads.length}件</div>
        <div class="label">合計見込み件数 ④〜⑦（${periodLabel}）</div>
      </div>
    `;
  }

  function renderMonthlyTagsInto(elId, sourceLeads, emptyMsg){
    const el = document.getElementById(elId);
    const map = {};
    sourceLeads.forEach(l=>{
      const ym = (l.date||'').slice(0,7);
      if(!ym) return;
      if(!map[ym]) map[ym] = {amount:0, count:0};
      map[ym].amount += Number(l.amount)||0;
      map[ym].count += 1;
    });
    const months = Object.keys(map).sort().reverse();
    if(months.length === 0){
      el.innerHTML = `<div class="monthly-empty">${emptyMsg}</div>`;
      return;
    }
    el.innerHTML = '';
    months.forEach(ym=>{
      const d = map[ym];
      const tag = document.createElement('div');
      tag.className = 'month-tag' + (monthFilter === ym ? ' active' : '');
      tag.innerHTML = `<span class="m-label">${monthLabel(ym)}</span><span class="m-amount">${formatYen(d.amount)}</span><span class="m-count">${d.count}件</span>`;
      tag.addEventListener('click', ()=>{
        monthFilter = (monthFilter === ym) ? '' : ym;
        renderAll();
      });
      el.appendChild(tag);
    });
  }

  const MONTHLY_PIPELINE_STATUSES = ['05','06','07']; // ⑤提案・見積提出〜⑦最終調整
  function renderMonthlyTags(){
    renderMonthlyTagsInto('monthlyTags', leads.filter(l=> MONTHLY_PIPELINE_STATUSES.includes(l.status)), '該当ステータス（⑤〜⑦）の案件が登録されるとここに月別の合計金額が表示されます。');
    renderMonthlyTagsInto('monthlyWonTags', leads.filter(isWon), '成約（⑧・⑨）の案件が登録されるとここに月別の成約金額が表示されます。');
  }

  // ---------- table ----------
  let sortKey = 'date';
  let sortAsc = false;
  let monthFilter = '';

  function getFiltered(){
    const q = searchBox.value.trim().toLowerCase();
    return leads.filter(l=>{
      if(filterAssignee.value && l.assignee !== filterAssignee.value) return false;
      if(filterStatus.value && l.status !== filterStatus.value) return false;
      if(filterPref.value && l.prefecture !== filterPref.value) return false;
      if(monthFilter && (l.date||'').slice(0,7) !== monthFilter) return false;
      if(q){
        const hay = [l.company, l.position, l.industry].join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    }).sort((a,b)=>{
      let av = a[sortKey] || '', bv = b[sortKey] || '';
      if(sortKey === 'assignee'){
        av = assigneeInfo(a.assignee)?.name || '';
        bv = assigneeInfo(b.assignee)?.name || '';
      }
      if(sortKey === 'status'){ av = a.status; bv = b.status; }
      if(sortKey === 'amount'){ av = Number(a.amount)||0; bv = Number(b.amount)||0; }
      if(av < bv) return sortAsc ? -1 : 1;
      if(av > bv) return sortAsc ? 1 : -1;
      return 0;
    });
  }

  function renderTable(){
    const body = document.getElementById('tableBody');
    const rows = getFiltered();
    body.innerHTML = '';
    document.getElementById('emptyState').style.display = rows.length ? 'none' : 'block';

    rows.forEach(l=>{
      const tr = document.createElement('tr');
      const st = statusInfo(l.status);
      const asg = assigneeInfo(l.assignee);
      const asgTag = asg ? `<span class="tag" style="background:${asg.color}">${escapeHtml(asg.name)}</span>` : '<span style="color:#c0c4cc;font-size:12px;">未設定</span>';
      const urlCell = l.url ? `<a class="url-link" href="${escapeAttr(l.url)}" target="_blank" rel="noopener">開く ↗</a>` : '';

      tr.innerHTML = `
        <td>${escapeHtml(l.date||'')}</td>
        <td>${escapeHtml(l.company||'')}</td>
        <td>${l.amount ? formatYen(l.amount) : ''}</td>
        <td>${escapeHtml(l.position||'')}</td>
        <td>${escapeHtml(l.prefecture||'')}</td>
        <td>${escapeHtml(l.industry||'')}</td>
        <td><span class="status-badge" style="color:${st.color};background:${st.bg}">${st.label}</span></td>
        <td>${asgTag}</td>
        <td>${urlCell}</td>
        <td class="memo-cell" title="${escapeAttr(l.memo||'')}">${escapeHtml(truncate(l.memo, 16))}</td>
        <td>
          <div class="row-actions">
            <button class="icon-btn" data-edit="${l.id}">編集</button>
            <button class="icon-btn" data-del="${l.id}">削除</button>
          </div>
        </td>
      `;
      body.appendChild(tr);
    });

    body.querySelectorAll('[data-edit]').forEach(b=>{
      b.addEventListener('click', ()=> openLeadModal(b.dataset.edit));
    });
    body.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', ()=> deleteLead(b.dataset.del));
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }
  function truncate(s, n){ s = s || ''; return s.length > n ? s.slice(0, n) + '…' : s; }

  document.querySelectorAll('thead th[data-sort]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.sort;
      if(sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; }
      renderTable();
    });
  });

  [filterAssignee, filterStatus, filterPref].forEach(el=> el.addEventListener('change', renderAll));
  searchBox.addEventListener('input', renderAll);
  document.getElementById('btnClearFilters').addEventListener('click', ()=>{
    filterAssignee.value=''; filterStatus.value=''; filterPref.value=''; searchBox.value=''; monthFilter='';
    renderAll();
  });

  // ---------- lead modal ----------
  const leadOverlay = document.getElementById('leadOverlay');
  const leadForm = document.getElementById('leadForm');

  function openLeadModal(id){
    fillAssigneeSelect(document.getElementById('f_assignee'), false);
    fillPrefectureSelect(document.getElementById('f_prefecture'), false);
    fillStatusSelect(document.getElementById('f_status'), false);

    document.getElementById('leadId').value = id || '';
    if(id){
      const l = leads.find(x=>x.id===id);
      document.getElementById('leadModalTitle').textContent = '案件を編集';
      document.getElementById('f_date').value = l.date || '';
      document.getElementById('f_assignee').value = l.assignee || '';
      document.getElementById('f_company').value = l.company || '';
      document.getElementById('f_amount').value = l.amount || '';
      document.getElementById('f_position').value = l.position || '';
      document.getElementById('f_prefecture').value = l.prefecture || '';
      document.getElementById('f_industry').value = l.industry || '';
      document.getElementById('f_status').value = l.status || '01';
      document.getElementById('f_url').value = l.url || '';
      document.getElementById('f_memo').value = l.memo || '';
    } else {
      document.getElementById('leadModalTitle').textContent = '新規登録';
      leadForm.reset();
      document.getElementById('f_date').value = new Date().toISOString().slice(0,10);
      document.getElementById('f_status').value = '01';
    }
    leadOverlay.classList.add('active');
  }
  function closeLeadModal(){ leadOverlay.classList.remove('active'); }

  document.getElementById('btnNew').addEventListener('click', ()=> openLeadModal(null));
  document.getElementById('btnCancelLead').addEventListener('click', closeLeadModal);
  leadOverlay.addEventListener('click', e=>{ if(e.target===leadOverlay) closeLeadModal(); });

  leadForm.addEventListener('submit', e=>{
    e.preventDefault();
    const id = document.getElementById('leadId').value;
    const data = {
      date: document.getElementById('f_date').value,
      assignee: document.getElementById('f_assignee').value,
      company: document.getElementById('f_company').value.trim(),
      amount: Number(document.getElementById('f_amount').value) || 0,
      position: document.getElementById('f_position').value.trim(),
      prefecture: document.getElementById('f_prefecture').value,
      industry: document.getElementById('f_industry').value.trim(),
      status: document.getElementById('f_status').value,
      url: document.getElementById('f_url').value.trim(),
      memo: document.getElementById('f_memo').value.trim(),
    };
    const req = id ? leadsCol.doc(id).update(data) : leadsCol.add(data);
    req.then(()=> closeLeadModal()).catch(handleFirestoreError);
  });

  function deleteLead(id){
    if(!confirm('この案件を削除しますか？')) return;
    leadsCol.doc(id).delete().catch(handleFirestoreError);
  }

  // ---------- assignee modal ----------
  const assigneeOverlay = document.getElementById('assigneeOverlay');

  function renderAssigneeList(){
    const list = document.getElementById('assigneeList');
    list.innerHTML = '';
    if(assignees.length === 0){
      list.innerHTML = '<div style="color:var(--sub);font-size:13px;padding:8px 0;">まだ担当者が登録されていません。下から追加してください。</div>';
    }
    assignees.forEach(a=>{
      const row = document.createElement('div');
      row.className = 'assignee-row';
      row.innerHTML = `
        <input type="color" class="color-swatch" value="${a.color}" data-color="${a.id}" style="padding:0;">
        <input type="text" value="${escapeAttr(a.name)}" data-name="${a.id}">
        <button class="icon-btn" data-remove="${a.id}">削除</button>
      `;
      list.appendChild(row);
    });
    list.querySelectorAll('[data-color]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        assigneesCol.doc(inp.dataset.color).update({color: inp.value}).catch(handleFirestoreError);
      });
    });
    list.querySelectorAll('[data-name]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const name = inp.value.trim();
        if(!name) return;
        assigneesCol.doc(inp.dataset.name).update({name}).catch(handleFirestoreError);
      });
    });
    list.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(!confirm('この担当者タグを削除しますか？（既存案件の担当者は未設定になります）')) return;
        const id = btn.dataset.remove;
        const affected = leads.filter(l=>l.assignee===id);
        Promise.all([
          assigneesCol.doc(id).delete(),
          ...affected.map(l=> leadsCol.doc(l.id).update({assignee:''}))
        ]).catch(handleFirestoreError);
      });
    });
  }

  document.getElementById('btnAssignees').addEventListener('click', ()=>{
    renderAssigneeList();
    assigneeOverlay.classList.add('active');
  });
  document.getElementById('btnCloseAssignees').addEventListener('click', ()=>{
    assigneeOverlay.classList.remove('active');
  });
  assigneeOverlay.addEventListener('click', e=>{ if(e.target===assigneeOverlay) assigneeOverlay.classList.remove('active'); });

  document.getElementById('btnAddAssignee').addEventListener('click', ()=>{
    const nameInput = document.getElementById('newAssigneeName');
    const colorInput = document.getElementById('newAssigneeColor');
    const name = nameInput.value.trim();
    if(!name){ nameInput.focus(); return; }
    assigneesCol.add({name, color: colorInput.value}).then(()=>{
      nameInput.value = '';
      const nextColor = DEFAULT_COLORS[assignees.length % DEFAULT_COLORS.length];
      colorInput.value = nextColor;
    }).catch(handleFirestoreError);
  });

  // ---------- CSV export ----------
  document.getElementById('btnExport').addEventListener('click', ()=>{
    const headers = ['日付','会社名','金額','役職','都道府県','業種','ステータス','担当者','URL','メモ'];
    const rows = getFiltered().map(l=>{
      const st = statusInfo(l.status);
      const asg = assigneeInfo(l.assignee);
      return [l.date, l.company, l.amount||0, l.position, l.prefecture, l.industry, st.label, asg?asg.name:'', l.url, l.memo||'']
        .map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',');
    });
    const csv = '﻿' + headers.join(',') + '\n' + rows.join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `GrandQuest案件一覧_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  });

  // ---------- render all ----------
  function renderAll(){
    fillAssigneeSelect(filterAssignee, true);
    renderHero();
    renderSummary();
    renderMonthlyTags();
    renderTable();
  }

  // ---------- lock screen ----------
  const APP_PASSWORD = '0215';
  const SESSION_KEY = 'sfa_unlocked_v1';
  const lockOverlay = document.getElementById('lockOverlay');
  const lockForm = document.getElementById('lockForm');
  const lockInput = document.getElementById('lockInput');
  const lockError = document.getElementById('lockError');

  document.getElementById('lockLogo').src = document.querySelector('.brand img').src;

  function unlockApp(){
    lockOverlay.classList.add('hidden');
    renderAll();
  }

  lockForm.addEventListener('submit', e=>{
    e.preventDefault();
    if(lockInput.value === APP_PASSWORD){
      sessionStorage.setItem(SESSION_KEY, '1');
      lockError.textContent = '';
      unlockApp();
    } else {
      lockError.textContent = 'パスワードが違います';
      lockInput.value = '';
      lockInput.focus();
    }
  });

  document.getElementById('btnLock').addEventListener('click', ()=>{
    sessionStorage.removeItem(SESSION_KEY);
    lockInput.value = '';
    lockError.textContent = '';
    lockOverlay.classList.remove('hidden');
    lockInput.focus();
  });

  if(sessionStorage.getItem(SESSION_KEY) === '1'){
    unlockApp();
  } else {
    lockInput.focus();
  }

  // ---------- Firestoreリアルタイム購読（全ての初期化が終わった後に開始） ----------
  leadsCol.onSnapshot(snap=>{
    leads = snap.docs.map(d=> ({id: d.id, ...d.data()}));
    renderAll();
  }, handleFirestoreError);

  assigneesCol.onSnapshot(snap=>{
    assignees = snap.docs.map(d=> ({id: d.id, ...d.data()}));
    renderAll();
    if(assigneeOverlay.classList.contains('active')) renderAssigneeList();
  }, handleFirestoreError);
})();
</script>
</body>
</html>
