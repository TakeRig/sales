<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自治体管理ツール</title>

<!-- Firebase（データを全員でリアルタイム共有するためのクラウドDB） -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyANQ8GB5WevN-hWZd6LYnZfROLYMQS7IPI",
    authDomain: "rig-el-sales.firebaseapp.com",
    projectId: "rig-el-sales",
    storageBucket: "rig-el-sales.firebasestorage.app",
    messagingSenderId: "597915479339",
    appId: "1:597915479339:web:ba4c638bcd22c1eda1296e",
    measurementId: "G-6MB744119Z"

</script>

<style>
  :root{
    --bg:#faf7f4;
    --panel:#ffffff;
    --border:#ece3dc;
    --text:#2a211d;
    --sub:#8a7c74;
    --accent:#eb6121;
    --accent-dark:#231916;
    --accent-light:#fdece0;
    --danger:#d64545;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand img{
    height:34px;
    width:auto;
    display:block;
  }
  .brand-divider{
    width:1px;
    height:28px;
    background:var(--border);
  }
  header h1{
    font-size:18px;
    margin:0;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--accent-dark);
  }
  header .sub{
    font-size:12px;
    color:var(--sub);
    margin-top:2px;
  }
  .header-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-size:13px;
    font-weight:600;
    transition:opacity .15s;
  }
  button:hover{opacity:.85;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:#eef1f6;color:var(--text);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:transparent;color:var(--sub);padding:6px 10px;}

  main{padding:20px 24px 60px;max-width:1400px;margin:0 auto;}

  .summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:8px;
    margin-bottom:20px;
  }
  .summary-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:10px 12px;
    text-align:center;
  }
  .summary-card .num{font-size:20px;font-weight:700;}
  .summary-card .label{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .toolbar{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:16px;
  }
  .toolbar input[type=text], .toolbar select{
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    background:#fff;
    color:var(--text);
  }
  .toolbar .grow{flex:1;min-width:160px;}
  .toolbar .spacer{flex:1;}

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--border);
    font-size:13px;
  }
  thead th{
    background:#fafbfd;
    text-align:left;
    padding:10px 12px;
    font-size:12px;
    color:var(--sub);
    border-bottom:1px solid var(--border);
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
  }
  thead th:hover{color:var(--text);}
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#f9fafc;}

  .status-badge{
    display:inline-block;
    padding:3px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
  }

  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    background:transparent;
    border:1px solid var(--border);
    padding:4px 8px;
    font-size:12px;
    border-radius:6px;
    color:var(--sub);
  }
  .icon-btn:hover{background:#f1f3f7;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--sub);
    font-size:13px;
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,24,33,.45);
    display:none;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .overlay.active{display:flex;}
  .modal{
    background:#fff;border-radius:14px;
    width:100%;max-width:520px;
    max-height:90vh;overflow-y:auto;
    padding:24px;
  }
  .modal h2{margin:0 0 18px;font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600;
  }
  .field input[type=text], .field input[type=date], .field select{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;
  }
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{
    display:flex;justify-content:flex-end;gap:8px;margin-top:20px;
  }

  footer{
    text-align:center;color:var(--sub);font-size:11px;padding:20px;
  }

  /* Lock screen */
  .lock-overlay{
    position:fixed;inset:0;z-index:100;
    background:linear-gradient(150deg,#231916,#3a2c25);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .lock-overlay.hidden{display:none;}
  .lock-card{
    background:#fff;border-radius:16px;
    width:100%;max-width:360px;
    padding:32px 28px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .lock-card img{height:36px;margin-bottom:18px;}
  .lock-card h2{font-size:15px;margin:0 0 20px;color:var(--text);font-weight:700;}
  .lock-card input[type=password]{
    width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
    font-size:18px;text-align:center;letter-spacing:.3em;font-family:inherit;
    box-sizing:border-box;
  }
  .lock-card input[type=password]:focus{outline:none;border-color:var(--accent);}
  .lock-card button{
    width:100%;margin-top:14px;padding:11px;background:var(--accent);color:#fff;font-size:14px;
  }
  .lock-error{
    color:var(--danger);font-size:12px;margin-top:10px;min-height:16px;
  }
  .btn-lock{background:transparent;border:1px solid var(--border);color:var(--sub);padding:9px 14px;}
  .page-nav{
    background:transparent;
    border:1px solid var(--border);
    color:var(--accent-dark);
    padding:9px 14px;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
  }
  .page-nav:hover{background:#f1f3f7;opacity:1;}
</style>
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <img id="lockLogo" alt="RIGEL">
    <h2>パスワードを入力してください</h2>
    <form id="lockForm">
      <input type="password" id="lockInput" inputmode="numeric" autocomplete="off" placeholder="••••" autofocus>
      <button type="submit" class="btn-primary">ログイン</button>
      <div class="lock-error" id="lockError"></div>
    </form>
  </div>
</div>

<header>
  <div class="brand">
    <img id="brandLogo" alt="RIGEL">
    <div class="brand-divider"></div>
    <div>
      <h1>自治体管理ツール</h1>
      <div class="sub">リグエル様専用 &middot; データは全員でリアルタイムに共有されます</div>
    </div>
  </div>
  <div class="header-actions">
    <a class="page-nav" href="index.html">案件管理へ</a>
    <a class="page-nav" href="grandquest.html">Grand Questへ</a>
    <button class="btn-primary" id="btnNew">＋ 新規登録</button>
    <button class="btn-lock" id="btnLock">ロック</button>
  </div>
</header>

<main>
  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <input type="text" id="searchBox" class="grow" placeholder="自治体名・担当者名で検索">
    <select id="filterStatus"><option value="">ステータス：すべて</option></select>
    <select id="filterPref"><option value="">都道府県：すべて</option></select>
    <div class="spacer"></div>
    <button class="btn-ghost" id="btnClearFilters">条件クリア</button>
  </div>

  <table>
    <thead>
      <tr>
        <th data-sort="date">日にち</th>
        <th data-sort="name">自治体名</th>
        <th data-sort="prefecture">都道府県</th>
        <th data-sort="position">担当役職</th>
        <th data-sort="contactName">担当者名</th>
        <th data-sort="status">ステータス</th>
        <th style="width:90px;">操作</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none;">まだ自治体が登録されていません。「＋ 新規登録」から追加してください。</div>
</main>

<footer>自治体管理ツール &middot; クラウド共有版</footer>

<!-- Municipality Modal -->
<div class="overlay" id="muniOverlay">
  <div class="modal">
    <h2 id="muniModalTitle">新規登録</h2>
    <form id="muniForm">
      <input type="hidden" id="muniId">
      <div class="field-row">
        <div class="field">
          <label>日にち</label>
          <input type="date" id="f_date" required>
        </div>
        <div class="field">
          <label>都道府県</label>
          <select id="f_prefecture"></select>
        </div>
      </div>
      <div class="field">
        <label>自治体名</label>
        <input type="text" id="f_name" placeholder="〇〇市役所 など" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>担当役職</label>
          <input type="text" id="f_position" placeholder="産業振興課 課長 など">
        </div>
        <div class="field">
          <label>担当者名</label>
          <input type="text" id="f_contactName" placeholder="山田様 など">
        </div>
      </div>
      <div class="field">
        <label>ステータス</label>
        <select id="f_status"></select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="btnCancelMuni">キャンセル</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const STATUSES = [
    {code:'01', label:'①アポ設定済み', color:'#2563eb', bg:'#e8f0fe'},
    {code:'02', label:'②説明済み', color:'#7c3aed', bg:'#f2ebfe'},
    {code:'07', label:'③前向き（上長確認）', color:'#0891b2', bg:'#e0f4f7'},
    {code:'03', label:'④参加希望', color:'#15803d', bg:'#e5f6ea'},
    {code:'04', label:'⑤不参加', color:'#dc2626', bg:'#fde8e8'},
    {code:'05', label:'⑥確認中', color:'#b45309', bg:'#fdf1de'},
    {code:'06', label:'⑦その他相談（案件切り替え）', color:'#eb6121', bg:'#fdece0'},
  ];

  const PREFECTURES = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];

  // ---------- Firestore（全員共有データ） ----------
  let munis = [];
  const munisCol = db.collection('municipalities');

  function handleFirestoreError(err){
    console.error(err);
    alert('データの保存・取得に失敗しました。firebaseConfig の設定が正しいかご確認ください。\n' + err.message);
  }

  function statusInfo(code){ return STATUSES.find(s=>s.code===code) || STATUSES[0]; }

  function fillPrefectureSelect(sel, includeAll){
    sel.innerHTML = '';
    if(includeAll){
      const o = document.createElement('option'); o.value=''; o.textContent='都道府県：すべて'; sel.appendChild(o);
    }
    PREFECTURES.forEach(p=>{
      const o = document.createElement('option'); o.value=p; o.textContent=p; sel.appendChild(o);
    });
  }
  function fillStatusSelect(sel, includeAll){
    sel.innerHTML = '';
    if(includeAll){
      const o = document.createElement('option'); o.value=''; o.textContent='ステータス：すべて'; sel.appendChild(o);
    }
    STATUSES.forEach(s=>{
      const o = document.createElement('option'); o.value=s.code; o.textContent=s.label; sel.appendChild(o);
    });
  }

  const filterStatus = document.getElementById('filterStatus');
  const filterPref = document.getElementById('filterPref');
  const searchBox = document.getElementById('searchBox');

  fillPrefectureSelect(filterPref, true);
  fillStatusSelect(filterStatus, true);

  // ---------- summary ----------
  function renderSummary(){
    const el = document.getElementById('summary');
    el.innerHTML = '';
    STATUSES.forEach(s=>{
      const count = munis.filter(m=>m.status===s.code).length;
      const card = document.createElement('div');
      card.className = 'summary-card';
      card.innerHTML = `<div class="num" style="color:${s.color}">${count}</div><div class="label">${s.label}</div>`;
      el.appendChild(card);
    });
  }

  // ---------- table ----------
  let sortKey = 'date';
  let sortAsc = false;

  function getFiltered(){
    const q = searchBox.value.trim().toLowerCase();
    return munis.filter(m=>{
      if(filterStatus.value && m.status !== filterStatus.value) return false;
      if(filterPref.value && m.prefecture !== filterPref.value) return false;
      if(q){
        const hay = [m.name, m.contactName].join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    }).sort((a,b)=>{
      let av = a[sortKey] || '', bv = b[sortKey] || '';
      if(av < bv) return sortAsc ? -1 : 1;
      if(av > bv) return sortAsc ? 1 : -1;
      return 0;
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderTable(){
    const body = document.getElementById('tableBody');
    const rows = getFiltered();
    body.innerHTML = '';
    document.getElementById('emptyState').style.display = rows.length ? 'none' : 'block';

    rows.forEach(m=>{
      const tr = document.createElement('tr');
      const st = statusInfo(m.status);
      tr.innerHTML = `
        <td>${escapeHtml(m.date||'')}</td>
        <td>${escapeHtml(m.name||'')}</td>
        <td>${escapeHtml(m.prefecture||'')}</td>
        <td>${escapeHtml(m.position||'')}</td>
        <td>${escapeHtml(m.contactName||'')}</td>
        <td><span class="status-badge" style="color:${st.color};background:${st.bg}">${st.label}</span></td>
        <td>
          <div class="row-actions">
            <button class="icon-btn" data-edit="${m.id}">編集</button>
            <button class="icon-btn" data-del="${m.id}">削除</button>
          </div>
        </td>
      `;
      body.appendChild(tr);
    });

    body.querySelectorAll('[data-edit]').forEach(b=>{
      b.addEventListener('click', ()=> openMuniModal(b.dataset.edit));
    });
    body.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', ()=> deleteMuni(b.dataset.del));
    });
  }

  document.querySelectorAll('thead th[data-sort]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.sort;
      if(sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; }
      renderTable();
    });
  });

  [filterStatus, filterPref].forEach(el=> el.addEventListener('change', renderAll));
  searchBox.addEventListener('input', renderAll);
  document.getElementById('btnClearFilters').addEventListener('click', ()=>{
    filterStatus.value=''; filterPref.value=''; searchBox.value='';
    renderAll();
  });

  // ---------- modal ----------
  const muniOverlay = document.getElementById('muniOverlay');
  const muniForm = document.getElementById('muniForm');

  function openMuniModal(id){
    fillPrefectureSelect(document.getElementById('f_prefecture'), false);
    fillStatusSelect(document.getElementById('f_status'), false);

    document.getElementById('muniId').value = id || '';
    if(id){
      const m = munis.find(x=>x.id===id);
      document.getElementById('muniModalTitle').textContent = '自治体を編集';
      document.getElementById('f_date').value = m.date || '';
      document.getElementById('f_name').value = m.name || '';
      document.getElementById('f_prefecture').value = m.prefecture || '';
      document.getElementById('f_position').value = m.position || '';
      document.getElementById('f_contactName').value = m.contactName || '';
      document.getElementById('f_status').value = m.status || '01';
    } else {
      document.getElementById('muniModalTitle').textContent = '新規登録';
      muniForm.reset();
      document.getElementById('f_date').value = new Date().toISOString().slice(0,10);
      document.getElementById('f_status').value = '01';
    }
    muniOverlay.classList.add('active');
  }
  function closeMuniModal(){ muniOverlay.classList.remove('active'); }

  document.getElementById('btnNew').addEventListener('click', ()=> openMuniModal(null));
  document.getElementById('btnCancelMuni').addEventListener('click', closeMuniModal);
  muniOverlay.addEventListener('click', e=>{ if(e.target===muniOverlay) closeMuniModal(); });

  muniForm.addEventListener('submit', e=>{
    e.preventDefault();
    const id = document.getElementById('muniId').value;
    const data = {
      date: document.getElementById('f_date').value,
      name: document.getElementById('f_name').value.trim(),
      prefecture: document.getElementById('f_prefecture').value,
      position: document.getElementById('f_position').value.trim(),
      contactName: document.getElementById('f_contactName').value.trim(),
      status: document.getElementById('f_status').value,
    };
    const req = id ? munisCol.doc(id).update(data) : munisCol.add(data);
    req.then(()=> closeMuniModal()).catch(handleFirestoreError);
  });

  function deleteMuni(id){
    if(!confirm('この自治体を削除しますか？')) return;
    munisCol.doc(id).delete().catch(handleFirestoreError);
  }

  // ---------- render all ----------
  function renderAll(){
    renderSummary();
    renderTable();
  }

  // ---------- lock screen ----------
  const APP_PASSWORD = '0215';
  const SESSION_KEY = 'sfa_unlocked_v1';
  const lockOverlay = document.getElementById('lockOverlay');
  const lockForm = document.getElementById('lockForm');

  document.getElementById('lockLogo').src = LOGO_SRC;
  document.getElementById('brandLogo').src = LOGO_SRC;

  function unlockApp(){
    lockOverlay.classList.add('hidden');
    renderAll();
  }

  lockForm.addEventListener('submit', e=>{
    e.preventDefault();
    if(lockInput.value === APP_PASSWORD){
      sessionStorage.setItem(SESSION_KEY, '1');
      lockError.textContent = '';
      unlockApp();
    } else {
      lockError.textContent = 'パスワードが違います';
      lockInput.value = '';
      lockInput.focus();
    }
  });

  document.getElementById('btnLock').addEventListener('click', ()=>{
    sessionStorage.removeItem(SESSION_KEY);
    lockInput.value = '';
    lockError.textContent = '';
    lockOverlay.classList.remove('hidden');
    lockInput.focus();
  });

  if(sessionStorage.getItem(SESSION_KEY) === '1'){
    unlockApp();
  } else {
    lockInput.focus();
  }

  // ---------- Firestoreリアルタイム購読（全ての初期化が終わった後に開始） ----------
  munisCol.onSnapshot(snap=>{
    munis = snap.docs.map(d=> ({id: d.id, ...d.data()}));
    renderAll();
  }, handleFirestoreError);
})();
